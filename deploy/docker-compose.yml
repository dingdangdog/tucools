services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    # 发布镜像时可设 TUCOOLS_ENGINE_IMAGE=ghcr.io/<owner>/tucools-engine:<version>。
    image: ${TUCOOLS_ENGINE_IMAGE:-tucools-engine:0.1.0}
    environment:
      TUCOOLS_MODEL_PACK: /model-pack
    volumes:
      # 宿主机上的模型包。可用 TUCOOLS_MODEL_PACK 指到解压目录，默认是仓库旁的 model-pack。
      - ${TUCOOLS_MODEL_PACK:-../model-pack}:/model-pack:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
      args:
        VITE_SITE_URL: ${TUCOOLS_SITE_URL:-}
    # 发布镜像时可设 TUCOOLS_WEB_IMAGE=ghcr.io/<owner>/tucools-web:<version>。
    image: ${TUCOOLS_WEB_IMAGE:-tucools-web:0.1.0}
    environment:
      # 逗号分隔的功能名。留空表示显示全部。说明见 docs/deploy.md。
      # cutout,enhance,erase,compress,resize,converter,id-photo,tocircle,cutting,watermark,caption,fade,pdf,favicon,exif,pix,prompt
      TUCOOLS_FEATURES: ${TUCOOLS_FEATURES:-}
      # 公开站点根地址，不带路径。构建和容器启动时都会读取；已是绝对地址时不会重复加前缀。
      TUCOOLS_SITE_URL: ${TUCOOLS_SITE_URL:-}
      # AdSense 发布商编号。留空则不加载广告，也不提供 ads.txt。改完后重新创建页面容器即可，不必重新构建镜像。
      TUCOOLS_ADSENSE_CLIENT: ${TUCOOLS_ADSENSE_CLIENT:-}
      # 可选。右侧广告单元编号。未设置时不留广告区。
      TUCOOLS_ADSENSE_SLOT: ${TUCOOLS_ADSENSE_SLOT:-}
      # Google Analytics 4 测量 ID。留空则不加载 gtag.js。改完后重新创建页面容器即可，不必重新构建镜像。
      TUCOOLS_ANALYTICS_ID: ${TUCOOLS_ANALYTICS_ID:-}
      # 工信部备案号。留空则左侧菜单底部不显示。形如「京ICP备12345678号」，可以带「-1」。
      TUCOOLS_ICP_NUMBER: ${TUCOOLS_ICP_NUMBER:-}
    # 浏览器打开宿主机 13175，与本地开发页相同。容器内 nginx 仍监听 8080，已发布镜像不用重建。
    ports:
      - "13175:8080"
    depends_on:
      - engine
    restart: unless-stopped
