services:
  engine:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.engine
    # 发布镜像时可设 TUCOOLS_ENGINE_IMAGE=ghcr.io/<owner>/tucools-engine:<version>。
    image: ${TUCOOLS_ENGINE_IMAGE:-tucools-engine:0.1.0}
    environment:
      TUCOOLS_MODEL_PACK: /model-pack
    volumes:
      # 宿主机上的模型包。可用 TUCOOLS_MODEL_PACK 指到解压目录，默认是仓库旁的 model-pack。
      - ${TUCOOLS_MODEL_PACK:-../model-pack}:/model-pack:ro
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    # 发布镜像时可设 TUCOOLS_WEB_IMAGE=ghcr.io/<owner>/tucools-web:<version>。
    image: ${TUCOOLS_WEB_IMAGE:-tucools-web:0.1.0}
    environment:
      # 逗号分隔的功能名。留空表示显示全部。说明见 docs/deploy.md。
      TUCOOLS_FEATURES: ${TUCOOLS_FEATURES:-}
    ports:
      - "8080:8080"
    depends_on:
      - engine
    restart: unless-stopped
