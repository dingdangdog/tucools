server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  location = /app-config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /api/engine/ {
    proxy_pass http://engine:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
  }

  location ~ ^/(en|zh_hant|es|de|ja|pt_br|hi|vn|ar|bn)(/|$) {
    try_files $uri $uri/index.html $uri/ /$1/index.html;
  }

  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}
