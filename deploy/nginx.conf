map $uri $tucools_llms {
  ~^/(en|zh_hant|es|de|ja|pt_br|hi|vn|ar|bn)/ /$1/llms.txt;
  default /llms.txt;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 60m;

  location ~ \.md$ {
    charset utf-8;
    charset_types text/markdown;
    default_type text/markdown;
    add_header X-Robots-Tag "noindex" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Link "<$tucools_llms>; rel=\"describedby\"" always;
    try_files $uri =404;
  }

  location ~ /llms(?:-full)?\.txt$ {
    charset utf-8;
    add_header X-Robots-Tag "noindex" always;
    try_files $uri =404;
  }

  location = /app-config.json {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location = /ads.txt {
    add_header Cache-Control "no-store";
    try_files $uri =404;
  }

  location /api/engine/ {
    proxy_pass http://engine:8787;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 600s;
    proxy_set_header Host $host;
  }

  location ~ ^/(en|zh_hant|es|de|ja|pt_br|hi|vn|ar|bn)(/|$) {
    try_files $uri $uri/index.html $uri/ /$1/index.html;
  }

  location / {
    try_files $uri $uri/index.html $uri/ /index.html;
  }
}
