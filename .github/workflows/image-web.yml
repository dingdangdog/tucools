name: 发布页面镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.3.0。从对应的 v 标签运行时可留空。
        required: false
        type: string
      latest:
        description: 是否移动 latest。auto 在没有更高版本时移动；always 总是移动；never 不移动。
        required: true
        type: choice
        default: auto
        options:
          - auto
          - always
          - never

permissions:
  contents: write
  packages: write

concurrency:
  group: image-web-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: 推送页面镜像
    uses: ./.github/workflows/image-reusable.yml
    with:
      kind: web
      dockerfile: deploy/Dockerfile.web
      timeout_minutes: 180
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest }}
      site_url: ${{ vars.TUCOOLS_SITE_URL }}
