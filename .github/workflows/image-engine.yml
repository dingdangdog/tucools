name: 发布引擎镜像

on:
  workflow_dispatch:
    inputs:
      version:
        description: 版本号，例如 0.3.0。工作流会在当前提交上创建 engine-v0.3.0。
        required: true
        type: string
      latest:
        description: 是否移动 latest。auto 在没有更高版本时移动；always 总是移动；never 不移动。
        required: true
        type: choice
        default: auto
        options:
          - auto
          - always
          - never

permissions:
  contents: write
  packages: write

concurrency:
  group: image-engine-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: 推送引擎镜像
    uses: ./.github/workflows/image-reusable.yml
    with:
      kind: engine
      dockerfile: deploy/Dockerfile.engine
      timeout_minutes: 360
      version: ${{ inputs.version }}
      latest: ${{ inputs.latest }}
      site_url: ""
