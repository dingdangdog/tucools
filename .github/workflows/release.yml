name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Read version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.get_version.outputs.tag }}
      version: ${{ steps.get_version.outputs.version }}
      web_image: ${{ steps.get_version.outputs.web_image }}
      engine_image: ${{ steps.get_version.outputs.engine_image }}
    steps:
      - name: Validate tag
        id: get_version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "标签必须是 v主版本.次版本.修订号，例如 v0.2.0。当前是：$TAG"
            exit 1
          fi
          VERSION="${TAG#v}"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          WEB_IMAGE="ghcr.io/${OWNER}/tucools-web"
          ENGINE_IMAGE="ghcr.io/${OWNER}/tucools-engine"
          echo "发布 ${TAG}，页面镜像 ${WEB_IMAGE}，引擎镜像 ${ENGINE_IMAGE}"
          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "web_image=${WEB_IMAGE}"
            echo "engine_image=${ENGINE_IMAGE}"
          } >> "$GITHUB_OUTPUT"

  docker:
    name: Build and push images
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      packages: write
    outputs:
      web_digest: ${{ steps.web.outputs.digest }}
      engine_digest: ${{ steps.engine.outputs.digest }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.web
          build-args: |
            VITE_SITE_URL=${{ vars.TUCOOLS_SITE_URL }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.version.outputs.web_image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.web_image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tucools-web
          cache-to: type=gha,scope=tucools-web,mode=max

      - name: Build and push engine image
        id: engine
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/Dockerfile.engine
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ needs.version.outputs.engine_image }}:${{ needs.version.outputs.version }}
            ${{ needs.version.outputs.engine_image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tucools-engine
          cache-to: type=gha,scope=tucools-engine,mode=max

      - name: Verify pushed manifests
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${{ needs.version.outputs.web_image }}:${{ needs.version.outputs.version }}"
          docker buildx imagetools inspect "${{ needs.version.outputs.engine_image }}:${{ needs.version.outputs.version }}"

  windows:
    name: Build Windows installer
    needs: version
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write version from tag
        shell: pwsh
        run: |
          $version = "${{ needs.version.outputs.version }}"
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') {
            throw "版本号无效：$version"
          }
          npm pkg set "version=$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pkg set "version=$version" --workspace @tucools/web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm pkg set "version=$version" --workspace @tucools/desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build web
        shell: pwsh
        env:
          VITE_SITE_URL: ${{ vars.TUCOOLS_SITE_URL }}
        run: |
          npm run build:web
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npx electron-builder --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dest = Join-Path $env:GITHUB_WORKSPACE "release-assets"
          New-Item -ItemType Directory -Force $dest | Out-Null
          Copy-Item "release\*.exe" $dest
          Copy-Item "release\*.blockmap" $dest -ErrorAction SilentlyContinue
          $installers = @(Get-ChildItem $dest -Filter *.exe)
          if ($installers.Count -lt 1) { throw "没有生成安装包" }
          $installers | Select-Object Name, Length

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          retention-days: 7
          path: release-assets/

  github_release:
    name: Publish GitHub Release
    needs: [version, docker, windows]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release-assets

      - name: Write checksums
        run: |
          set -euo pipefail
          cd release-assets
          exe=( *.exe )
          if [[ ! -e "${exe[0]}" ]]; then
            echo "安装包没有出现在 release-assets 根目录"
            find . -type f -print
            exit 1
          fi
          sha256sum ./* > SHA256SUMS.txt
          ls -lh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
          body: |
            ## Windows 安装包

            附件中的安装包没有代码签名。里面是页面和桌面壳，不含模型包，也不含 `tucools-engine.exe`。安装后把模型包解压到 `%APPDATA%\tucools\model-pack`。没有可用的本机 Python 或 `TUCOOLS_RUNTIME` 时，本地工具仍可使用，AI 功能需要另备引擎。

            ## Docker 镜像

            镜像在 GitHub Container Registry。本次版本会同时标成 `latest`。镜像不含模型包，引擎只留在 Compose 网络内。

            - 页面：`${{ needs.version.outputs.web_image }}:${{ needs.version.outputs.version }}`
            - 引擎：`${{ needs.version.outputs.engine_image }}:${{ needs.version.outputs.version }}`
            - 页面摘要：`${{ needs.docker.outputs.web_digest }}`
            - 引擎摘要：`${{ needs.docker.outputs.engine_digest }}`

            容器包第一次发布时默认私有。需要给其他人拉取时，在 GitHub 的 Packages 页面把这两个包改为公开。

            ```powershell
            $env:TUCOOLS_WEB_IMAGE = "${{ needs.version.outputs.web_image }}:${{ needs.version.outputs.version }}"
            $env:TUCOOLS_ENGINE_IMAGE = "${{ needs.version.outputs.engine_image }}:${{ needs.version.outputs.version }}"
            docker compose -f deploy/docker-compose.yml pull
            docker compose -f deploy/docker-compose.yml up -d
            ```
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
