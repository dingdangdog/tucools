name: （内部）构建并推送镜像

on:
  workflow_call:
    inputs:
      kind:
        description: web 或 engine
        required: true
        type: string
      dockerfile:
        description: Dockerfile 路径
        required: true
        type: string
      timeout_minutes:
        description: 任务超时（分钟）
        required: true
        type: number
      version:
        description: 不带 v 的版本号；从标签运行时可留空
        required: false
        type: string
        default: ""
      latest:
        description: auto、yes 或 no
        required: true
        type: string
      site_url:
        description: 仅页面镜像使用的 VITE_SITE_URL
        required: false
        type: string
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  push:
    name: 推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: bash .github/scripts/resolve-version.sh

      - name: Choose image tags
        id: tags
        env:
          INPUT_LATEST: ${{ inputs.latest }}
          KIND: ${{ inputs.kind }}
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ inputs.kind == 'web' && steps.version.outputs.web_image || steps.version.outputs.engine_image }}
        run: |
          set -euo pipefail
          case "$KIND" in
            web|engine) ;;
            *)
              echo "kind 只能是 web 或 engine。"
              exit 1
              ;;
          esac
          bash .github/scripts/image-tags.sh

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Image description
        id: desc
        env:
          KIND: ${{ inputs.kind }}
        run: |
          set -euo pipefail
          if [[ "$KIND" == "web" ]]; then
            text="图酷页面，在浏览器里完成本地图像处理，并把抠图、优化和消除转发到同源引擎。"
          else
            text="图酷图像处理引擎，提供抠图、优化和消除。镜像不含模型包。"
          fi
          echo "text=${text}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          build-args: |
            ${{ inputs.kind == 'web' && format('VITE_SITE_URL={0}', inputs.site_url) || '' }}
            ${{ inputs.kind == 'web' && format('VITE_APP_VERSION={0}', steps.version.outputs.version) || '' }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # 证明清单会在包页面多出 unknown/unknown，描述也可能读不到。
          provenance: false
          labels: |
            org.opencontainers.image.description=${{ steps.desc.outputs.text }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=${{ steps.desc.outputs.text }}
            manifest:org.opencontainers.image.description=${{ steps.desc.outputs.text }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            manifest:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            manifest:org.opencontainers.image.version=${{ steps.version.outputs.version }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            manifest:org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=tucools-${{ inputs.kind }}
          cache-to: type=gha,scope=tucools-${{ inputs.kind }},mode=max

      - name: Verify pushed manifest
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          EXPECTED: ${{ steps.desc.outputs.text }}
        run: node .github/scripts/verify-image-description.mjs

      - name: Attach image note
        env:
          GH_TOKEN: ${{ github.token }}
          KIND: ${{ inputs.kind }}
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          DIGEST: ${{ steps.push.outputs.digest }}
          MARK_LATEST: ${{ steps.tags.outputs.mark_latest }}
          WEB_IMAGE: ${{ steps.version.outputs.web_image }}
          ENGINE_IMAGE: ${{ steps.version.outputs.engine_image }}
        run: bash .github/scripts/publish-image-note.sh
