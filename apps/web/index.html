<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--tucools-seo-->
    <title>图酷</title>
    <meta
      name="description"
      content="图酷为压缩、缩放、转格式、裁剪、证件照尺寸、社交尺寸、应用商店尺寸、切图、水印、加字、灰度、圆形、图转 PDF、Favicon、去除信息、图片信息和 AI提示词提取提供独立地址，并在浏览器本地处理。抠图、优化和消除只请求同源引擎。"
    />
    <!--/tucools-seo-->
    <link rel="icon" href="/logo.webp" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem("tucools-theme");
          var prefersDark = false;
          try {
            prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {}
          var dark =
            theme === "light"
              ? false
              : theme === "dark"
                ? true
                : theme === "system"
                  ? prefersDark
                  : true;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript id="tucools-noscript"></noscript>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
